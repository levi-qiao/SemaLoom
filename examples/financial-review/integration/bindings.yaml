- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: Mapping
  id: finance.AuditReport.mock
  target: finance.AuditReport
  objectType: finance.AuditReport
  sourceId: sample_api
  provider: openapi
  expectedCardinality: ONE
  completeness: PARTIAL
  physical:
    operationId: getSampleAuditReview
    method: GET
    path: /mock/audit-review
    identityParameter: reportId
    identityPointer: /reportId
    grainPointers:
      reportId: /reportId
    propertyPointers:
      reviewStatus: /reviewStatus
