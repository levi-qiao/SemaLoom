- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: IntegrationBinding
  id: finance.samples
  provider: postgres
  sourceId: sample_pg
  mappings:
  - finance.Company.pg
  - finance.TaxReturn.pg
  - finance.AuditReport.pg
  - finance.AuditFactor.pg
  - finance.ReturnLine.pg
- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: IntegrationBinding
  id: finance.mock
  provider: openapi
  sourceId: sample_api
  mappings:
  - finance.AuditReport.mock
- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: Mapping
  id: finance.Company.pg
  target: finance.Company
  objectType: finance.Company
  sourceId: sample_pg
  provider: postgres
  expectedCardinality: ONE
  completeness: PARTIAL
  physical:
    table: sample_taxpayer
    tenantColumn: tenant_id
    identityColumn: id
    grainColumns:
      companyId: id
    propertyColumns:
      name: name
- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: Mapping
  id: finance.TaxReturn.pg
  target: finance.TaxReturn
  objectType: finance.TaxReturn
  sourceId: sample_pg
  provider: postgres
  expectedCardinality: ONE
  completeness: PARTIAL
  physical:
    table: sample_declaration
    tenantColumn: tenant_id
    identityColumn: id
    grainColumns:
      returnId: id
    propertyColumns:
      companyId: taxpayer_id
      taxYear: tax_year
      periodStart: period_start
      periodEnd: period_end
      revenue: revenue
      totalProfit: total_profit
      taxableIncome: taxable_income
      incomeTax: income_tax
- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: Mapping
  id: finance.AuditReport.pg
  target: finance.AuditReport
  objectType: finance.AuditReport
  sourceId: sample_pg
  provider: postgres
  expectedCardinality: ONE
  completeness: PARTIAL
  physical:
