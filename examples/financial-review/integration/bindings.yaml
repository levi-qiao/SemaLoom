      companyId: taxpayer_id
      returnId: declaration_id
    propertyColumns:
      taxYear: tax_year
      format: source_format
- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: Mapping
  id: finance.AuditFactor.pg
  target: finance.AuditFactor
  objectType: finance.AuditFactor
  sourceId: sample_pg
  provider: postgres
  expectedCardinality: ONE
  completeness: PARTIAL
  physical:
