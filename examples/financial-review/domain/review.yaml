- apiVersion: semaloom/v0.1
  version: 1.0.0
  kind: ObjectType
  id: finance.ReviewCase
  label: 年度财务分析样本
  description: 按企业和年度选择的申报及审计样本，ID 固定到具体报告。数值采用上游归一化人民币元契约，未逐份核对原始报告。pairingPolicy
    为最新样本选择，uniquePair=false 时不能称为唯一正式版本。sourceReviewStatus 是真实源状态，与 mock 流转无关。先按
    companyName/taxYear 搜索实例，再查询指标/判断；结论必须说明样本选择和抽取状态。
  identityKeys:
  - caseId
  properties:
  - id: caseId
    valueType: STRING
    label: 分析样本编号
    required: true
  - id: companyId
    valueType: STRING
    label: 企业编号
  - id: companyName
    valueType: STRING
    label: 企业名称
  - id: taxYear
    valueType: INTEGER
    label: 会计年度
    semanticRoles: [time.year, time.sequence]
  - id: reportId
    valueType: STRING
    label: 审计报告编号
  - id: returnId
    valueType: STRING
    label: 申报编号
  - id: periodStart
    valueType: DATE
    label: 期间起
  - id: periodTo
    valueType: DATE
    label: 期间止（不含）
  - id: uniquePair
    valueType: BOOLEAN
    label: 该年度是否仅有一份申报和报告
    values:
    - id: "true"
      label: 唯一配对
    - id: "false"
      label: 存在多个候选
  - id: pairingPolicy
    valueType: STRING
    label: 样本选择规则
    aliases:
    - 配对规则
    values:
    - id: LATEST_UPDATED_SAMPLE
      label: 最新样本
      aliases:
      - 最新样本
  - id: sourceReviewStatus
    valueType: STRING
    label: 来源真实复核状态
    aliases:
    - 复核状态
    values:
    - id: unreviewed
      label: 未复核
      aliases:
      - 未复核
      - 待复核
    - id: reviewed
      label: 已复核
      aliases:
      - 已复核
      - 复核通过
  - id: unitBasis
    valueType: STRING
    label: 金额单位依据
  - id: audit_profitStatus
    valueType: STRING
    label: 审计利润总额抽取状态
    values:
    - id: observed
      label: 已取得数值
    - id: not_disclosed
      label: 来源未披露
    - id: extraction_failed
      label: 抽取未成功
    - id: not_evaluated
      label: 尚未抽取
  - id: net_profitStatus
    valueType: STRING
    label: 审计净利润抽取状态
    values:
    - id: observed
      label: 已取得数值
    - id: not_disclosed
      label: 来源未披露
    - id: extraction_failed
      label: 抽取未成功
    - id: not_evaluated
      label: 尚未抽取
  - id: tax_expenseStatus
    valueType: STRING
    label: 所得税费用抽取状态
    values:
    - id: observed
      label: 已取得数值
    - id: not_disclosed
      label: 来源未披露
    - id: extraction_failed
      label: 抽取未成功
    - id: not_evaluated
      label: 尚未抽取
  - id: assetsStatus
    valueType: STRING
    label: 资产总计抽取状态
    values:
    - id: observed
      label: 已取得数值
    - id: not_disclosed
      label: 来源未披露
    - id: extraction_failed
      label: 抽取未成功
    - id: not_evaluated
      label: 尚未抽取
  - id: liabilitiesStatus
    valueType: STRING
    label: 负债合计抽取状态
    values:
    - id: observed
      label: 已取得数值
    - id: not_disclosed
      label: 来源未披露
    - id: extraction_failed
      label: 抽取未成功
    - id: not_evaluated
      label: 尚未抽取
  - id: equityStatus
    valueType: STRING
    label: 所有者权益合计抽取状态
    values:
    - id: observed
      label: 已取得数值
    - id: not_disclosed
      label: 来源未披露
    - id: extraction_failed
      label: 抽取未成功
    - id: not_evaluated
      label: 尚未抽取
  - id: declared_profit
    valueType: DECIMAL
    unit: CNY
    additivity: FULL
    label: 选定申报利润总额
    aliases:
    - 申报利润
    - 利润
    - 申报利润总额
    - 选定申报利润总额
    - 报税利润
  - id: audit_profit
    valueType: DECIMAL
    unit: CNY
    additivity: FULL
    label: 抽取审计利润总额
    aliases:
    - 审计利润
    - 利润
    - 审计利润总额
    - 抽取审计利润总额
    - 审定利润
  - id: net_profit
    valueType: DECIMAL
    unit: CNY
    additivity: FULL
    label: 抽取审计净利润
    aliases:
    - 净利润
    - 审计净利润
    - 抽取审计净利润
    - 净收益
  - id: tax_expense
    valueType: DECIMAL
    unit: CNY
    additivity: FULL
    label: 抽取审计所得税费用
    aliases:
    - 所得税费用
    - 抽取审计所得税费用
    - 所得税
    - 税金费用
  - id: assets
    valueType: DECIMAL
    unit: CNY
    additivity: SEMI
    label: 抽取审计资产总计
    aliases:
    - 资产
    - 总资产
    - 资产总计
    - 抽取审计资产总计
  - id: liabilities
    valueType: DECIMAL
    unit: CNY
    additivity: SEMI
    label: 抽取审计负债合计
    aliases:
    - 负债
    - 负债合计
    - 总负债
    - 抽取审计负债合计
  - id: equity
    valueType: DECIMAL
    unit: CNY
    additivity: SEMI
    label: 抽取审计所有者权益合计
    aliases:
    - 权益
    - 所有者权益
    - 净资产
    - 股东权益
    - 抽取审计所有者权益合计
  period:
    fromProperty: periodStart
    toProperty: periodTo
  population:
    unitProperty: companyId
    scopeProperties: [taxYear]
    description: 当前授权本地样本中每企业每年一份选定分析样本；不代表全行业、全部正式报告或已复核数据。重复企业年度拒绝汇总。
