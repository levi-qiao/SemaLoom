- apiVersion: semaloom/v0.1
  kind: ObjectType
  id: warehouse.Sku
  version: "1.0.0"
  label: 库存SKU
  identityKeys: [skuId]
  properties:
    - id: skuId
      label: SKU
      valueType: STRING
      required: true
    - id: category
      label: 类别
      valueType: STRING
      aliases:
        - 品类
      values:
        - id: A
          label: 类别A
          aliases: [A类]
        - id: B
          label: 类别B
          aliases: [B类]
    - id: stockYear
      label: 年度
      valueType: INTEGER
      semanticRoles: [time.year, time.sequence]
    - id: onHandQty
      label: 在库数量
      valueType: DECIMAL
      unit: EA
      additivity: SEMI
      aliases:
        - 库存
        - 在库
        - 现存量
        - 库存量
