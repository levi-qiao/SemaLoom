- apiVersion: semaloom/v0.1
  kind: Rule
  id: procurement.amountWithinLimit
  version: "1.0.0"
  label: 金额未超授权
  description: 判断采购订单金额是否不超过该组织的授权额度。成立后才允许创建采购草稿。结果为成立、不成立或数据不足无法判断。
  claim: procurement.amountWithinLimit
  aliases:
    - 采购金额是否超限
    - 是否超额
    - 额度核验
    - 采购未超限
    - 金额未超授权
    - 是否在授权额度内
  applicability: [organizationId]
  inputs:
    - name: amount
      metric: procurement.orderAmount
      required: true
    - name: limit
      metric: procurement.approvalLimit
      required: true
  expression:
    op: le
    args:
      - {op: ref, name: amount}
      - {op: ref, name: limit}

- apiVersion: semaloom/v0.1
  kind: Policy
  id: procurement.amountWithinLimitOrgA
  version: "1.0.0"
  rule: procurement.amountWithinLimit
  dimensions:
    organizationId: ORG-A
  interval:
    effectiveFrom: "2024-01-01"
    effectiveTo: null

- apiVersion: semaloom/v0.1
  kind: Action
  id: procurement.CreatePurchaseDraft
  version: "1.0.0"
  label: 创建采购草稿
  description: 在采购业务系统中生成采购草稿，经授权额度核验后可转为正式采购订单
  targetObject: procurement.Order
  effect: Create a purchase draft in the synthetic order system
  preconditions: [procurement.amountWithinLimit]
  parameters:
    - name: amount
      label: 金额
      valueType: DECIMAL
      required: true
    - name: note
      label: 备注说明
      valueType: STRING
      required: false

- apiVersion: semaloom/v0.1
  kind: AuthorizationProfile
  id: procurement.defaultAccess
  version: "1.0.0"
  roles: [buyer, approver]
  capabilities:
    - query
    - evaluateClaim
    - planAction
  resourceTypes: [procurement.Order, procurement.Supplier]

- apiVersion: semaloom/v0.1
  kind: Rule
  id: procurement.remainingCommitment.rule
  version: "1.0.0"
  label: 合同可用余额计算
  outputMetric: procurement.remainingCommitment
  inputs:
    - name: contractValue
      metric: procurement.contractValue
      required: true
    - name: committedSpend
      metric: procurement.committedSpend
      required: true
  expression:
    op: sub
    args:
      - {op: ref, name: contractValue}
      - {op: ref, name: committedSpend}

- apiVersion: semaloom/v0.1
  kind: Rule
  id: procurement.contractUtilization.rule
  version: "1.0.0"
  label: 合同使用率计算
  outputMetric: procurement.contractUtilization
  inputs:
    - name: committedSpend
      metric: procurement.committedSpend
      required: true
    - name: contractValue
      metric: procurement.contractValue
      required: true
  expression:
    op: div
    args:
      - {op: ref, name: committedSpend}
      - {op: ref, name: contractValue}

- apiVersion: semaloom/v0.1
  kind: Rule
  id: procurement.commitmentWithinContract
  version: "1.0.0"
  label: 已承诺金额是否未超过合同总额
  description: 对选定合成合同的金额做确定性核对；成立不代表合同审批或履约合规，缺失金额时无法判断。
  claim: procurement.commitmentWithinContract
  aliases: [合同是否超额, 承诺金额是否超合同, 合同额度核验]
  inputs:
    - name: committedSpend
      metric: procurement.committedSpend
      required: true
    - name: contractValue
      metric: procurement.contractValue
      required: true
  expression:
    op: le
    args:
      - {op: ref, name: committedSpend}
      - {op: ref, name: contractValue}

- apiVersion: semaloom/v0.1
  kind: Policy
  id: procurement.commitmentWithinContract.policy
  version: "1.0.0"
  rule: procurement.commitmentWithinContract
  dimensions: {}
  interval:
    effectiveFrom: "2024-01-01"
    effectiveTo: null
