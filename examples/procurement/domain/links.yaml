- apiVersion: semaloom/v0.1
  kind: Link
  id: procurement.orderSupplier
  version: "1.0.0"
  label: 供货方
  description: 采购订单由哪家供应商供货。
  source: procurement.Order
  target: procurement.Supplier
  cardinality: ONE
  identity:
    - source: supplierId
      target: supplierId
  traversal: FORWARD

- apiVersion: semaloom/v0.1
  kind: Link
  id: procurement.orderOrganization
  version: "1.0.0"
  label: 所属组织
  description: 采购订单属于哪个下单组织。
  source: procurement.Order
  target: procurement.Organization
  cardinality: ONE
  identity:
    - source: organizationId
      target: organizationId
  traversal: FORWARD

- apiVersion: semaloom/v0.1
  kind: Link
  id: procurement.contractSupplier
  version: "1.0.0"
  label: 合同供应商
  description: 采购合同与签约供应商之间的业务关联。
  source: procurement.Contract
  target: procurement.Supplier
  cardinality: ONE
  identity:
    - source: supplierId
      target: supplierId
  traversal: FORWARD

- apiVersion: semaloom/v0.1
  kind: Link
  id: procurement.contractOrganization
  version: "1.0.0"
  label: 合同所属组织
  description: 采购合同由哪个组织签订和管理。
  source: procurement.Contract
  target: procurement.Organization
  cardinality: ONE
  identity:
    - source: organizationId
      target: organizationId
  traversal: FORWARD
