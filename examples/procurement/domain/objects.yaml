- apiVersion: semaloom/v0.1
  kind: ObjectType
  id: procurement.Organization
  version: "1.0.0"
  label: 组织
  description: 采购业务中的下单组织，用 organizationId 标识。
  identityKeys: [organizationId]
  properties:
    - id: organizationId
      label: 组织编号
      valueType: STRING
      required: true
    - id: name
      label: 名称
      valueType: STRING
    - id: approvalLimit
      label: 审批额度
      valueType: DECIMAL
      unit: CNY
      additivity: FULL
      aliases:
        - 审批限额
        - 额度
        - 授权额度
        - 审批额度

- apiVersion: semaloom/v0.1
  kind: ObjectType
  id: procurement.Supplier
  version: "1.0.0"
  label: 供应商
  description: 向企业供货的供应商。
  identityKeys: [supplierId]
  properties:
    - id: supplierId
      label: 供应商编号
      valueType: STRING
      required: true
    - id: name
      label: 名称
      valueType: STRING
    - id: region
      label: 区域
      valueType: STRING
      aliases:
        - 地区
      values:
        - id: EAST
          label: 华东区
          aliases: [华东, 东部]
        - id: NORTH
          label: 华北区
          aliases: [华北, 北部]
        - id: WEST
          label: 西部
          aliases: [西区]

- apiVersion: semaloom/v0.1
  kind: ObjectType
  id: procurement.Order
  version: "1.0.0"
  label: 采购订单
  description: 企业向供应商发出的采购订单，用订单编号标识。金额、数量来自订单库，交货风险来自独立接口。
  identityKeys: [orderId]
  properties:
    - id: orderId
      label: 订单编号
      valueType: STRING
      required: true
    - id: organizationId
      label: 组织编号
      valueType: STRING
      required: true
    - id: supplierId
      label: 供应商编号
      valueType: STRING
      required: true
    - id: status
      label: 状态
      valueType: STRING
      aliases:
        - 订单状态
      values:
        - id: OPEN
          label: 未关闭
          aliases: [进行中, 执行中, 开放]
        - id: CLOSED
          label: 已关闭
          aliases: [关闭, 结案, 完成]
    - id: deliveryRisk
      label: 交货风险
      valueType: STRING
      aliases:
        - 风险等级
        - 履约风险
      values:
        - id: LOW
          label: 低风险
          aliases: [低, 正常]
        - id: MEDIUM
          label: 中风险
          aliases: [中, 预警, 中等]
        - id: HIGH
          label: 高风险
          aliases: [高, 严重, 危险]
    - id: amount
      label: 订单金额
      valueType: DECIMAL
      unit: CNY
      additivity: FULL
      aliases:
        - 采购金额
        - 采购额
        - 订单总额
        - 采购订单总额
        - 采购订单金额
    - id: quantity
      label: 订单数量
      valueType: DECIMAL
      unit: EA
      additivity: FULL
      aliases:
        - 采购数量
        - 订货量

- apiVersion: semaloom/v0.1
  kind: ObjectType
  id: procurement.Contract
  version: "1.0.0"
  label: 采购合同
  description: 企业与供应商签订的采购合同；合同金额与已承诺金额来自合同台账，缺失承诺额不按零处理。
  identityKeys: [contractId]
  properties:
    - id: contractId
      label: 合同编号
      valueType: STRING
      required: true
    - id: organizationId
      label: 组织编号
      valueType: STRING
      required: true
    - id: supplierId
      label: 供应商编号
      valueType: STRING
      required: true
    - id: accountingPeriod
      label: 会计期间
      valueType: STRING
      required: true
      aliases: [合同期间, 账期]
    - id: category
      label: 合同类别
      valueType: STRING
      aliases: [采购类别, 品类]
      values:
        - id: GOODS
          label: 货物采购
          aliases: [货物, 商品]
        - id: SERVICE
          label: 服务采购
          aliases: [服务]
        - id: LOGISTICS
          label: 物流采购
          aliases: [物流, 运输]
    - id: status
      label: 合同状态
      valueType: STRING
      aliases: [履约状态]
      values:
        - id: ACTIVE
          label: 履约中
          aliases: [有效, 执行中]
        - id: EXPIRING
          label: 即将到期
          aliases: [临期, 待续签]
        - id: CLOSED
          label: 已结束
          aliases: [结束, 已关闭]
    - id: contractValue
      label: 合同总额
      valueType: DECIMAL
      unit: CNY
      additivity: FULL
      aliases: [合同金额, 合同价值]
    - id: committedSpend
      label: 已承诺金额
      valueType: DECIMAL
      unit: CNY
      additivity: FULL
      aliases: [承诺金额, 已占用金额]
  population:
    unitProperty: contractId
    scopeProperties: [accountingPeriod]
    description: 当前授权合成合同台账按会计期间统计；同一合同只计一次，不代表企业全部采购承诺。
