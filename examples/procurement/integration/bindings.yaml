- apiVersion: semaloom/v0.1
  kind: IntegrationBinding
  id: procurement.postgres
  version: "1.0.0"
  provider: postgres
  sourceId: orders_pg
  mappings:
    - procurement.Order.orders
    - procurement.Organization.orders

- apiVersion: semaloom/v0.1
  kind: IntegrationBinding
  id: procurement.draft-api
  version: "1.0.0"
  provider: openapi
  sourceId: proc_draft_api
  actionBindings:
    - procurement.CreatePurchaseDraft.openapi
  mappings:
    - procurement.Order.riskApi

- apiVersion: semaloom/v0.1
  kind: IntegrationBinding
  id: procurement.suppliers
  version: "1.0.0"
  provider: postgres
  sourceId: suppliers_pg
  mappings:
    - procurement.Supplier.suppliers

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: procurement.Order.riskApi
  version: "1.0.0"
  target: procurement.Order
  sourceId: proc_draft_api
  provider: openapi
  objectType: procurement.Order
  expectedCardinality: ONE
  completeness: PARTIAL
  physical:
    operationId: getOrderRisk
    method: GET
    path: /order-risk
    identityParameter: orderId
    identityPointer: /orderId
    grainPointers:
      orderId: /orderId
    propertyPointers:
      deliveryRisk: /deliveryRisk

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: procurement.Order.orders
  version: "1.0.0"
  target: procurement.Order
  sourceId: orders_pg
  provider: postgres
  objectType: procurement.Order
  expectedCardinality: ONE
  completeness: AUTHORITATIVE
  physical:
    table: proc_order
    identityColumn: order_id
    grainColumns:
      orderId: order_id
    propertyColumns:
      status: status
      supplierId: supplier_id
      organizationId: organization_id
      amount: amount
      quantity: quantity

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: procurement.Organization.orders
  version: "1.0.0"
  target: procurement.Organization
  sourceId: orders_pg
  provider: postgres
  objectType: procurement.Organization
  expectedCardinality: ONE
  completeness: AUTHORITATIVE
  physical:
    table: proc_organization
    identityColumn: organization_id
    grainColumns:
      organizationId: organization_id
    propertyColumns:
      name: name
      approvalLimit: approval_limit

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: procurement.Supplier.suppliers
  version: "1.0.0"
  target: procurement.Supplier
  sourceId: suppliers_pg
  provider: postgres
  objectType: procurement.Supplier
  expectedCardinality: ONE
  completeness: AUTHORITATIVE
  physical:
    table: proc_supplier
    identityColumn: supplier_id
    grainColumns:
      supplierId: supplier_id
    propertyColumns:
      name: name

- apiVersion: semaloom/v0.1
  kind: ActionBinding
  id: procurement.CreatePurchaseDraft.openapi
  version: "1.0.0"
  action: procurement.CreatePurchaseDraft
  sourceId: proc_draft_api
  provider: openapi
  idempotent: true
  reconcilable: true
  physical:
    operationId: createPurchaseDraft
    method: POST
    path: /drafts
