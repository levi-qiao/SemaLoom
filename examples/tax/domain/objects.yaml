- apiVersion: semaloom/v0.1
  kind: ObjectType
  id: tax.Taxpayer
  version: "1.0.0"
  label: 纳税人
  description: 税务域中的纳税主体。金额在申报事实表中，按年度、口径和科目读取，不在本体穷举。
  identityKeys: [taxpayerId]
  properties:
    - id: taxpayerId
      label: 纳税人编号
      valueType: STRING
      required: true
    - id: name
      label: 名称
      valueType: STRING
    - id: jurisdiction
      label: 管辖地
      valueType: STRING
      required: true
      aliases:
        - 属地
        - 区域
        - 税收居民地
      values:
        - id: CN
          label: 中国境内
          aliases: [境内, 国内, 中国, 境内机构]
        - id: OVERSEAS
          label: 境外
          aliases: [境外机构, 国外, 海外]
    - id: taxYear
      label: 税款所属期
      valueType: INTEGER
    - id: perspective
      label: 口径
      valueType: STRING
      aliases: [数据口径, 报告口径]
      values:
        - id: TAX_RETURN
          label: 申报口径
          aliases: [申报, 纳税申报]
        - id: AUDIT_REPORT
          label: 审计口径
          aliases: [审计, 审计报告]
    - id: amount
      label: 金额
      valueType: DECIMAL
      unit: CNY
      additivity: FULL
      aliases:
        - 税额
        - 纳税金额
  population:
    unitProperty: taxpayerId
    scopeProperties: [taxYear, perspective]
    description: 合成税务样本按纳税人、年度和数据口径统计，不代表全部纳税人或已复核申报。

- apiVersion: semaloom/v0.1
  kind: ObjectType
  id: tax.Filing
  version: "1.0.0"
  label: 纳税申报
  description: 某纳税人在某一年度、某一口径下的申报记录。
  identityKeys: [filingId]
  properties:
    - id: filingId
      label: 申报编号
      valueType: STRING
      required: true
    - id: taxpayerId
      label: 纳税人编号
      valueType: STRING
      required: true
    - id: taxYear
      label: 税款所属期
      valueType: INTEGER
      required: true
      semanticRoles: [time.year, time.sequence]
    - id: perspective
      label: 口径
      valueType: STRING
      required: true
