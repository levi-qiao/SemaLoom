- apiVersion: semaloom/v0.1
  kind: Metric
  id: tax.vatPayable
  version: "1.0.0"
  objectType: tax.Taxpayer
  property: amount
  select:
    measureCode: vatPayable
    perspective: TAX_RETURN
  perspective: TAX_RETURN
  label: 应交增值税（演示）
  aliases:
    - 增值税
    - 应交增值税
    - 增值税额
    - 应纳增值税

- apiVersion: semaloom/v0.1
  kind: Metric
  id: tax.adjustmentAmount
  version: "1.0.0"
  objectType: tax.Taxpayer
  valueType: DECIMAL
  unit: CNY
  grain: [taxpayerId, taxYear]
  aggregation: NONE
  additivity: FULL
  derivedFrom: [tax.reportedIncome, tax.auditIncome]
  aliases:
    - 调整额
    - 收入差异
    - 调账金额
    - 审计调整
    - 差异金额
