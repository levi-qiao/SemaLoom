- apiVersion: semaloom/v0.1
  kind: IntegrationBinding
  id: tax.postgres
  version: "1.0.0"
  provider: postgres
  sourceId: tax_pg
  mappings:
    - tax.Taxpayer.pg
    - tax.Taxpayer.facts.pg

- apiVersion: semaloom/v0.1
  kind: IntegrationBinding
  id: tax.draft-api
  version: "1.0.0"
  provider: openapi
  sourceId: tax_draft_api
  actionBindings:
    - tax.CreateTaxAdjustmentDraft.openapi

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: tax.Taxpayer.pg
  version: "1.0.0"
  target: tax.Taxpayer
  sourceId: tax_pg
  provider: postgres
  objectType: tax.Taxpayer
  expectedCardinality: ONE
  completeness: AUTHORITATIVE
  capabilities: [POINT_READ, COLLECTION_READ, EQUI_JOIN]
  physical:
    table: tax_taxpayer
    identityColumn: taxpayer_id
    propertyColumns:
      name: name
      jurisdiction: jurisdiction
    grainColumns:
      taxpayer: taxpayer_id
      taxpayerId: taxpayer_id

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: tax.Taxpayer.facts.pg
  version: "1.0.0"
  target: tax.Taxpayer
  sourceId: tax_pg
  provider: postgres
  objectType: tax.Taxpayer
  expectedCardinality: ONE
  completeness: AUTHORITATIVE
  capabilities: [POINT_READ, COLLECTION_READ, EQUI_JOIN]
  physical:
    table: tax_metric
    identityColumn: taxpayer_id
    grainColumns:
      taxpayerId: taxpayer_id
      taxYear: tax_year
      perspective: perspective
      measureCode: metric
    propertyColumns:
      amount: amount

- apiVersion: semaloom/v0.1
  kind: ActionBinding
  id: tax.CreateTaxAdjustmentDraft.openapi
  version: "1.0.0"
  action: tax.CreateTaxAdjustmentDraft
  sourceId: tax_draft_api
  provider: openapi
  idempotent: true
  reconcilable: true
  physical:
    operationId: createAdjustmentDraft
    method: POST
    path: /drafts
