- apiVersion: semaloom/v0.1
  kind: IntegrationBinding
  id: tax.postgres
  version: "1.0.0"
  provider: postgres
  sourceId: tax_pg
  mappings:
    - tax.operatingRevenue.taxReturn
    - tax.operatingRevenue.audit
    - tax.otherRevenue.taxReturn
    - tax.reportedIncome.pg
    - tax.auditIncome.pg
    - tax.vatPayable.pg
    - tax.Taxpayer.pg

- apiVersion: semaloom/v0.1
  kind: IntegrationBinding
  id: tax.draft-api
  version: "1.0.0"
  provider: openapi
  sourceId: tax_draft_api
  actionBindings:
    - tax.CreateTaxAdjustmentDraft.openapi

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: tax.operatingRevenue.taxReturn
  version: "1.0.0"
  target: tax.operatingRevenue
  sourceId: tax_pg
  provider: postgres
  objectType: tax.Taxpayer
  perspective: TAX_RETURN
  expectedCardinality: ONE
  completeness: AUTHORITATIVE
  physical:
    table: tax_metric
    identityColumn: taxpayer_id
    valueColumn: amount
    grainColumns:
      taxpayer: taxpayer_id
      taxpayerId: taxpayer_id
    propertyColumns:
      name: name
      jurisdiction: jurisdiction
      taxYear: tax_year
      perspective: perspective
    filters:
      metric: operatingRevenue
      perspective: TAX_RETURN

- apiVersion: semaloom/v0.1
  kind: Mapping
  id: tax.operatingRevenue.audit
  version: "1.0.0"
  target: tax.operatingRevenue
  sourceId: tax_pg
  provider: postgres
  objectType: tax.Taxpayer
  perspective: AUDIT_REPORT
