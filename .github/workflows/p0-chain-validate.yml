name: P0 Clean Cut Validation

on:
  push:
    branches:
      - feat/p0-capability-composite-identity

permissions:
  contents: write

concurrency:
  group: p0-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-build:
    if: ${{ contains(github.event.head_commit.message, '[run-p0-clean]') && !contains(github.event.head_commit.message, '[p0-chain-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semaloom
          POSTGRES_PASSWORD: semaloom
          POSTGRES_DB: semaloom_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semaloom -d semaloom_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: semaloom
      SEMALOOM_TAX_DATABASE_URL: postgresql+psycopg://semaloom:semaloom@127.0.0.1:5432/semaloom_tax
      SEMALOOM_ORDERS_DATABASE_URL: postgresql+psycopg://semaloom:semaloom@127.0.0.1:5432/semaloom_orders
      SEMALOOM_SUPPLIERS_DATABASE_URL: postgresql+psycopg://semaloom:semaloom@127.0.0.1:5432/semaloom_suppliers
      SEMALOOM_META_DATABASE_URL: postgresql+psycopg://semaloom:semaloom@127.0.0.1:5432/semaloom_meta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p0-capability-composite-identity
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Align migration script with current branch
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('.github/scripts/finish_p0_chain.py')
          text = script.read_text()
          text = text.replace(
              '    if actual < count:\n        raise SystemExit(f"{path}: expected >= {count} occurrences, found {actual}: {old[:120]!r}")\n    write(path, text.replace(old, new, count))',
              '    if actual < count:\n        print(f"skip replace already migrated: {path}: {old[:80]!r}")\n        return\n    write(path, text.replace(old, new, count))',
          )
          text = text.replace(
              '    if actual != count:\n        raise SystemExit(f"{path}: expected {count} regex replacements, found {actual}: {pattern[:120]!r}")\n    write(path, updated)',
              '    if actual != count:\n        print(f"skip regex already migrated: {path}: {pattern[:80]!r}")\n        return\n    write(path, updated)',
          )
          text = text.replace('identityParameters', 'parameterBindings')
          text = text.replace(
              'from semaloom.core.provider import ObjectRead, ObjectSearch, ReadProvider\\n',
              'from semaloom.core.provider import IdentityValue, ObjectRead, ObjectSearch, ReadProvider\\n',
          )
          text = text.replace(
              'identity_value: str,\\n        extra_filters: dict[str, str] | None = None,\\n',
              'identity_value: IdentityValue,\\n        extra_filters: dict[str, str] | None = None,\\n',
          )
          script.write_text(text)

          roots = [Path('src/semaloom'), Path('frontend/src'), Path('examples')]
          for root in roots:
              for path in root.rglob('*'):
                  if path.suffix not in {'.py', '.ts', '.tsx', '.yaml', '.yml'}:
                      continue
                  value = path.read_text()
                  if 'identityParameters' in value:
                      path.write_text(value.replace('identityParameters', 'parameterBindings'))
          PY
      - name: Apply clean-cut migration
        run: python .github/scripts/finish_p0_chain.py
      - name: Finalize clean generated tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path: str, transform) -> None:
              target = Path(path)
              target.write_text(transform(target.read_text()))

          def fix_ir(text: str) -> str:
              text = text.replace(
                  'from typing import Any, Sequence',
                  'from collections.abc import Sequence\nfrom typing import Any',
              )
              text = text.replace(
                  'grain, properties, capabilities = _provider_contract(mapping)',
                  'grain, properties, capabilities = _provider_contract(mapping, obj.identity_keys)',
              )
              text = text.replace(
                  'def _provider_contract(\n    mapping: MappingDef,\n)',
                  'def _provider_contract(\n    mapping: MappingDef, identity_fields: Sequence[str],\n)',
              )
              text = text.replace(
                  'missing_parameters = [key for key in grain if key not in parameters]\n'
                  '        identity_like = [key for key in missing_parameters if key in mapping.identity_fields]\n'
                  '        if identity_like:\n'
                  '            raise ValueError(f"identity parameters missing: {\', \'.join(identity_like)}")',
                  'missing_parameters = [key for key in identity_fields if key not in parameters]\n'
                  '        if missing_parameters:\n'
                  '            raise ValueError(\n'
                  '                f"identity parameters missing: {\', \'.join(missing_parameters)}"\n'
                  '            )',
              )
              return text

          patch('src/semaloom/compiler/mapping_ir.py', fix_ir)

          def fix_studio(text: str) -> str:
              text = text.replace(
                  'from semaloom.core.provider import IdentityValue, ReadProvider',
                  'from semaloom.core.provider import IdentityScalar, IdentityValue, ReadProvider',
              )
              text = text.replace(
                  'bindings: dict[str, str] | None = None,',
                  'bindings: dict[str, IdentityScalar] | None = None,',
              )
              replacement = '''def _required_preview_bindings(
              mapping: MappingDef, identity_fields: list[str] | None = None
          ) -> list[str]:
              identity = set(identity_fields or mapping.identity_fields)
              return [field for field in mapping.grain_fields if field not in identity]
          '''
              return re.sub(
                  r'def _required_preview_bindings\(.*?\n\ndef _preview_value',
                  replacement + '\n\ndef _preview_value',
                  text,
                  count=1,
                  flags=re.DOTALL,
              )

          patch('src/semaloom/runtime/studio.py', fix_studio)

          def fix_eval(text: str) -> str:
              text = text.replace(
                  'from semaloom.core.model import PolicyDef, RuleDef\n',
                  'from semaloom.core.model import PolicyDef, RuleDef\n'
                  'from semaloom.core.provider import IdentityScalar\n',
              )
              text = text.replace('dict[str, str | int]', 'dict[str, IdentityScalar]')
              text = re.sub(
                  r'''            try:\n                normalized_bindings = query\.normalize_bindings\(\n                    MetricSelect\(metric=spec\.metric, bindings=bindings\)\n                \)\n            except ValueError as exc:\n                raise EvaluationError\("INVALID_BINDINGS", "conflicting identity aliases"\) from exc\n            metric_bindings = \{\n                key: value\n                for key, value in normalized_bindings\.items\(\)\n                if key in metric\.grain or key == "perspective"\n            \}''',
                  '''            metric_bindings = {
                key: value
                for key, value in bindings.items()
                if key in metric.grain or key == "perspective"
            }''',
                  text,
                  count=1,
              )
              return text

          patch('src/semaloom/runtime/eval.py', fix_eval)

          def fix_http(text: str) -> str:
              text = text.replace(
                  'from semaloom.core.bundle import CompiledBundle\n',
                  'from semaloom.core.bundle import CompiledBundle\n'
                  'from semaloom.core.provider import IdentityScalar\n',
              )
              text = text.replace('dict[str, str | int]', 'dict[str, IdentityScalar]')
              text = text.replace(
                  'bindings: dict[str, str] = Field(default_factory=dict)',
                  'bindings: dict[str, IdentityScalar] = Field(default_factory=dict)',
              )
              return text

          patch('src/semaloom/app/http.py', fix_http)

          for path in Path('tests').rglob('*.py'):
              text = path.read_text()
              if 'IdentityValue' not in text:
                  continue
              if re.search(r'from semaloom\.core\.provider import .*\bIdentityValue\b', text):
                  continue
              marker = text.find('from semaloom.')
              if marker >= 0:
                  text = (
                      text[:marker]
                      + 'from semaloom.core.provider import IdentityValue\n'
                      + text[marker:]
                  )
                  path.write_text(text)

          prompt = Path('src/semaloom/app/chat/system_prompt.txt')
          text = prompt.read_text()
          old = (
              '集合统计默认同源同事实表。已声明且基数为 ONE 的 PostgreSQL Link，可以用关联对象属性做 groupBy 或筛选'
              '（例如 finance.Company.name 或 procurement.Supplier.name）；同源走 SQL JOIN，跨源由引擎按业务键分批对齐，'
              '不要发明 SQL，也不要把键列表交给模型循环查询。一对多、非 PostgreSQL 目标、多跳或未声明路径仍不支持。'
          )
          new = (
              '集合统计只使用服务端声明的 analysisCapabilities。仅当 Link 明确返回 collectionJoin=true 时，才可用关联对象属性做 '
              'groupBy 或筛选（例如 finance.Company.name 或 procurement.Supplier.name）。执行方式由已发布 capability 决定，'
              '不要根据 provider 名称或物理数据源猜测能力，不要发明 SQL，也不要把键列表交给模型循环查询。'
              '一对多、多跳或未声明路径仍不支持。'
          )
          if old in text:
              prompt.write_text(text.replace(old, new))

          Path('.github/scripts/finish_p0_chain.py').unlink(missing_ok=True)
          PY
      - name: Install backend
        run: uv python install && uv sync --frozen --all-groups
      - name: Normalize generated Python
        run: |
          uv run ruff check --fix .
          uv run ruff format .
      - name: Create fixture databases
        run: |
          for database in semaloom_tax semaloom_orders semaloom_suppliers semaloom_meta semaloom_g4_tax semaloom_g4_orders semaloom_g4_suppliers semaloom_g4_meta; do
            createdb --host 127.0.0.1 --username semaloom "$database"
          done
      - name: Backend tests
        run: uv run pytest
      - name: Backend static checks
        run: |
          uv run ruff format --check .
          uv run ruff check src tests
          uv run mypy src/semaloom
      - name: Frontend check and build
        working-directory: frontend
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Clean-boundary assertions
        run: |
          ! grep -R -nE '"identityColumn"|"identityPointer"|"identityParameter"|"identityColumns"|"identityPointers"|"identityParameters"' src/semaloom frontend/src examples
          ! grep -n 'mapping\.physical' src/semaloom/runtime/query.py
          ! grep -n 'provider == "postgres"' src/semaloom/runtime/discovery.py
          ! grep -n 'normalize_bindings' src/semaloom/runtime/query.py src/semaloom/runtime/eval.py src/semaloom/app/chat/tools.py
          ! grep -n 'identity: str' src/semaloom/app/http.py src/semaloom/runtime/studio.py
          ! grep -n 'PostgreSQL Link' src/semaloom/app/chat/system_prompt.txt
          test -f src/semaloom/compiler/mapping_ir.py
          test -f tests/test_composite_identity_chain.py
      - name: Commit validated implementation
        run: |
          rm -f .github/scripts/finish_p0_chain.py .github/workflows/p0-chain-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete capability IR and composite identity chain [p0-chain-complete]"
          git push origin HEAD:feat/p0-capability-composite-identity
