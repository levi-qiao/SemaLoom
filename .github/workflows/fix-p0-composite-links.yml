name: Complete P0 composite links

on:
  push:
    branches:
      - feat/p0-capability-composite-identity
    paths:
      - .github/scripts/fix_p0_composite_links.py
      - .github/workflows/fix-p0-composite-links.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/p0-capability-composite-identity
          fetch-depth: 0
      - name: Align helper migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/fix_p0_composite_links.py')
          text = p.read_text()
          marker = '# Frontend relation editor supports an arbitrary non-empty list of identity pairs.'
          start = text.index('p = Path("src/semaloom/runtime/query.py")\ntext = p.read_text()\nold = dedent(', text.index('# Runtime resolves'))
          end = text.index(marker, start)
          replacement = '''replace_between(
              "src/semaloom/runtime/query.py",
              "    def _object_mapping_for_property(\\n",
              "    def _mapping_for_target(\\n",
              """
                  def _object_mapping_for_properties(
                      self, object_type: str, property_ids: tuple[str, ...]
                  ) -> tuple[MappingDef | None, str | None]:
                      required = set(property_ids)
                      candidates = [
                          mapping
                          for mapping in self.bundle.mappings
                          if mapping.target == object_type and required <= _mapped_object_fields(mapping)
                      ]
                      if len(candidates) == 1:
                          return candidates[0], None
                      if len(candidates) > 1:
                          return None, "AMBIGUOUS_MAPPING"
                      return None, "NO_MAPPING"

                  def _object_mapping_for_property(
                      self, object_type: str, property_id: str
                  ) -> tuple[MappingDef | None, str | None]:
                      return self._object_mapping_for_properties(object_type, (property_id,))
              """,
          )

          '''
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Apply migration
        run: python .github/scripts/fix_p0_composite_links.py
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Backend checks
        run: |
          uv python install
          uv sync --frozen --all-groups
          uv run ruff format src/semaloom/core/model.py src/semaloom/compiler/api.py src/semaloom/runtime/query.py tests/test_composite_link_identity.py
          uv run ruff check src/semaloom/core/model.py src/semaloom/compiler/api.py src/semaloom/runtime/query.py tests/test_composite_link_identity.py
          uv run mypy
          uv run pytest tests/test_composite_link_identity.py tests/test_composite_identity_chain.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: frontend/.node-version
      - name: Frontend checks
        working-directory: frontend
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit clean implementation
        run: |
          rm .github/scripts/fix_p0_composite_links.py
          rm .github/workflows/fix-p0-composite-links.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: make link traversal composite-identity complete"
          git push origin HEAD:feat/p0-capability-composite-identity
# rerun aligned helper
