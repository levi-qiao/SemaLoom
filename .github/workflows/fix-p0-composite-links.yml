                      offenders.append(f"{p}: runtime scalar link identity access")
                  if re.search(r'(?m)^\s*identity:\n\s+source:\s', text):
                      offenders.append(f"{p}: scalar YAML link identity")
                  if re.search(r'["\']identity["\']\s*:\s*\{\s*["\']source["\']', text):
                      offenders.append(f"{p}: scalar dict link identity")
              
          if offenders:
              raise SystemExit("\n".join(offenders))
