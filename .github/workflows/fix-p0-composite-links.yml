name: Complete P0 composite links

on:
  push:
    branches: [feat/p0-capability-composite-identity]
    paths: [.github/workflows/fix-p0-composite-links.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/p0-capability-composite-identity
          fetch-depth: 0
      - name: Apply composite link identity migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              i = text.index(start)
              j = text.index(end, i)
              p.write_text(text[:i] + replacement.rstrip() + "\n\n" + text[j:])

          # Core: Link identity is directly a non-empty tuple of semantic source→target pairs.
          p = Path("src/semaloom/core/model.py")
          text = p.read_text()
          old = '''class LinkIdentity(BaseModel):
              model_config = wire_config()

              source: str
              target: str


          class LinkDef(_Doc):
              kind: Literal["Link"] = "Link"
              source: str
              target: str
              identity: LinkIdentity
              cardinality: Cardinality
              traversal: Literal["FORWARD"] = "FORWARD"'''
          new = '''class LinkIdentityPair(BaseModel):
              model_config = wire_config()

              source: str
              target: str


          class LinkDef(_Doc):
              kind: Literal["Link"] = "Link"
              source: str
              target: str
              identity: tuple[LinkIdentityPair, ...] = Field(min_length=1)
              cardinality: Cardinality
              traversal: Literal["FORWARD"] = "FORWARD"'''
          if old not in text:
              raise SystemExit("core LinkIdentity block changed")
          p.write_text(text.replace(old, new))

          # Compiler: validate every pair, pair types, duplicates, and complete target identity coverage.
          replace_between(
              "src/semaloom/compiler/api.py",
              "def _check_links(\n",
              "def _check_rules(\n",
              '''def _check_links(
              objects: Sequence[ObjectTypeDef],
              links: Sequence[LinkDef],
              diagnostics: list[Diagnostic],
          ) -> None:
              object_index = _index(objects)
              for link in links:
                  source = object_index.get(link.source)
                  target = object_index.get(link.target)
                  if source is None:
                      diagnostics.append(
                          Diagnostic(code="DANGLING_REF", path=f"{link.id}.source", message=link.source)
                      )
                  if target is None:
                      diagnostics.append(
                          Diagnostic(code="DANGLING_REF", path=f"{link.id}.target", message=link.target)
                      )
                  if source is None or target is None:
                      continue

                  source_types = {prop.id: prop.value_type for prop in source.properties}
                  target_types = {prop.id: prop.value_type for prop in target.properties}
                  source_fields = [pair.source for pair in link.identity]
                  target_fields = [pair.target for pair in link.identity]
                  if len(source_fields) != len(set(source_fields)) or len(target_fields) != len(set(target_fields)):
                      diagnostics.append(
                          Diagnostic(
                              code="MISSING_LINK_IDENTITY",
                              path=f"{link.id}.identity",
                              message="link identity fields must be unique",
                          )
                      )
                  if len(target_fields) != len(target.identity_keys) or set(target_fields) != set(target.identity_keys):
                      diagnostics.append(
                          Diagnostic(
                              code="MISSING_LINK_IDENTITY",
                              path=f"{link.id}.identity",
                              message="link identity must cover every target identity key exactly once",
                          )
                      )
                  for index, pair in enumerate(link.identity):
                      if pair.source not in source_types:
                          diagnostics.append(
                              Diagnostic(
                                  code="MISSING_LINK_IDENTITY",
                                  path=f"{link.id}.identity.{index}.source",
                                  message=pair.source,
                              )
                          )
                          continue
                      if pair.target not in target_types:
                          diagnostics.append(
                              Diagnostic(
                                  code="MISSING_LINK_IDENTITY",
                                  path=f"{link.id}.identity.{index}.target",
                                  message=pair.target,
                              )
                          )
                          continue
                      if source_types[pair.source] != target_types[pair.target]:
                          diagnostics.append(
                              Diagnostic(
                                  code="TYPE_MISMATCH",
                                  path=f"{link.id}.identity.{index}",
                                  message="linked identity fields must have the same value type",
                              )
                          )'''
          )

          # Runtime: resolve all source fields together and construct the full target identity atomically.
          replace_between(
              "src/semaloom/runtime/query.py",
              "    def follow_link(\n",
              "    def _metric(\n",
              '''    def follow_link(
              self,
              *,
              link_id: str,
              source_identity: IdentityValue,
              actor: RequestActor,
          ) -> EvidenceEnvelope:
              request_id = uuid.uuid4().hex
              decision = authorize_query(actor, "query")
              if not decision.allowed:
                  return EvidenceEnvelope(
                      request_id=request_id,
                      release_digest=self.bundle.digest,
                      observations=(Observation(kind="FORBIDDEN", target=link_id, reason=decision.reason),),
                      diagnostics=(Diagnostic(code="FORBIDDEN", path=link_id, message=decision.reason),),
                      status="FAILED",
                  )
              link = next((item for item in self.bundle.links if item.id == link_id), None)
              if link is None:
                  return EvidenceEnvelope(
                      request_id=request_id,
                      release_digest=self.bundle.digest,
                      observations=(),
                      diagnostics=(Diagnostic(code="NO_PATH", path=link_id, message="unknown link"),),
                      status="FAILED",
                  )
              source_obj = next(item for item in self.bundle.object_types if item.id == link.source)
              target_obj = next(item for item in self.bundle.object_types if item.id == link.target)
              if set(source_identity) != set(source_obj.identity_keys):
                  return EvidenceEnvelope(
                      request_id=request_id,
                      release_digest=self.bundle.digest,
                      observations=(),
                      diagnostics=(
                          Diagnostic(
                              code="INVALID_BINDINGS",
                              path=link_id,
                              message="source identity must contain every declared identity component",
                          ),
                      ),
                      status="FAILED",
                  )
              target_fields = tuple(pair.target for pair in link.identity)
              if len(target_fields) != len(target_obj.identity_keys) or set(target_fields) != set(target_obj.identity_keys):
                  return EvidenceEnvelope(
                      request_id=request_id,
                      release_digest=self.bundle.digest,
                      observations=(),
                      diagnostics=(
                          Diagnostic(
                              code="INVALID_LINK_IDENTITY",
                              path=link_id,
                              message="link identity does not cover the target object identity",
                          ),
                      ),
                      status="FAILED",
                  )
              source_identity_value: IdentityValue = {
                  key: source_identity[key] for key in source_obj.identity_keys
              }
              source_fields = tuple(pair.source for pair in link.identity)
              source_mapping, source_error = self._object_mapping_for_properties(link.source, source_fields)
              target_mapping, target_error = self._object_mapping_for_properties(
                  link.target, target_obj.identity_keys
              )
              if source_mapping is None or target_mapping is None:
                  error = source_error or target_error or "NO_MAPPING"
                  return EvidenceEnvelope(
                      request_id=request_id,
                      release_digest=self.bundle.digest,
                      observations=(),
                      diagnostics=(Diagnostic(code=error, path=link_id, message="link mapping is not resolvable"),),
                      status="FAILED",
                  )
              source_read = self.provider.fetch_object(
                  source_mapping, tenant=actor.tenant, identity_value=source_identity_value
              )
              source_activity = SourceActivity(
                  activity_id=uuid.uuid4().hex,
                  mapping_id=source_mapping.id,
                  source_id=source_mapping.source_id,
                  query_digest=_digest(
                      {"link": link_id, "sourceIdentity": source_identity_value, "tenant": actor.tenant}
                  ),
                  observed_at=source_read.observed_at,
                  authorization_ref=decision.decision_id,
              )
              if source_read.kind != "PRESENT":
                  reason = source_read.reason or ("NOT_FOUND" if source_read.kind == "MISSING" else "PROVIDER_ERROR")
                  return EvidenceEnvelope(
                      request_id=request_id,
                      release_digest=self.bundle.digest,
                      observations=(Observation(kind=source_read.kind, target=link.target, reason=reason),),
                      source_activities=(source_activity,),
                      diagnostics=(
                          (Diagnostic(code=reason, path=link_id, message="source read failed"),)
                          if source_read.kind == "UNAVAILABLE"
                          else ()
                      ),
                      status="FAILED" if source_read.kind == "UNAVAILABLE" else "SUCCEEDED",
                  )

              target_values: dict[str, object] = {}
              for pair in link.identity:
                  value = source_read.values.get(pair.source)
                  if value is None:
                      return EvidenceEnvelope(
                          request_id=request_id,
                          release_digest=self.bundle.digest,
                          observations=(
                              Observation(kind="MISSING", target=link.target, reason="LINK_IDENTITY_MISSING"),
                          ),
                          source_activities=(source_activity,),
                          status="SUCCEEDED",
                      )
                  target_values[pair.target] = value
              target_identity: IdentityValue = {
                  key: target_values[key] for key in target_obj.identity_keys  # type: ignore[assignment]
              }
              target_read = self.provider.fetch_object(
                  target_mapping, tenant=actor.tenant, identity_value=target_identity
              )
              target_activity = SourceActivity(
                  activity_id=uuid.uuid4().hex,
                  mapping_id=target_mapping.id,
                  source_id=target_mapping.source_id,
                  query_digest=_digest(
                      {"link": link_id, "targetIdentity": target_identity, "tenant": actor.tenant}
                  ),
                  observed_at=target_read.observed_at,
                  authorization_ref=decision.decision_id,
              )
              observation = Observation(
                  kind=target_read.kind,
                  target=link.target,
                  bindings=target_identity,
                  value=(
                      str(
                          target_read.values.get("name")
                          or " / ".join(str(target_identity[key]) for key in target_obj.identity_keys)
                      )
                      if target_read.kind == "PRESENT"
                      else None
                  ),
                  reason=target_read.reason,
                  mapping_id=target_mapping.id,
                  source_id=target_mapping.source_id,
                  observed_at=target_read.observed_at,
              )
              diagnostics = (
                  (
                      Diagnostic(
                          code=target_read.reason or "PROVIDER_ERROR",
                          path=link_id,
                          message="target read failed",
                      ),
                  )
                  if target_read.kind == "UNAVAILABLE"
                  else ()
              )
              return EvidenceEnvelope(
                  request_id=request_id,
                  release_digest=self.bundle.digest,
                  observations=(observation,),
                  source_activities=(source_activity, target_activity),
                  diagnostics=diagnostics,
                  status="FAILED" if target_read.kind == "UNAVAILABLE" else "SUCCEEDED",
                  extras={
                      "sourceSourceId": source_mapping.source_id,
                      "targetSourceId": target_mapping.source_id,
                      "targetIdentity": target_identity,
                  },
              )'''
          )

          p = Path("src/semaloom/runtime/query.py")
          text = p.read_text()
          old = '''    def _object_mapping_for_property(
              self, object_type: str, property_id: str
          ) -> tuple[MappingDef | None, str | None]:
              candidates = [
                  mapping
                  for mapping in self.bundle.mappings
                  if mapping.target == object_type and property_id in _mapped_object_fields(mapping)
              ]
              if len(candidates) == 1:
                  return candidates[0], None
              if len(candidates) > 1:
                  return None, "AMBIGUOUS_MAPPING"
              return None, "NO_MAPPING"
          '''
          new = '''    def _object_mapping_for_properties(
              self, object_type: str, property_ids: tuple[str, ...]
          ) -> tuple[MappingDef | None, str | None]:
              required = set(property_ids)
              candidates = [
                  mapping
                  for mapping in self.bundle.mappings
                  if mapping.target == object_type and required <= _mapped_object_fields(mapping)
              ]
              if len(candidates) == 1:
                  return candidates[0], None
              if len(candidates) > 1:
                  return None, "AMBIGUOUS_MAPPING"
              return None, "NO_MAPPING"

              def _object_mapping_for_property(
              self, object_type: str, property_id: str
          ) -> tuple[MappingDef | None, str | None]:
              return self._object_mapping_for_properties(object_type, (property_id,))
          '''
          # Fix indentation in helper replacement string deliberately after dedent-like literal.
          new = new.replace("\n              def _object_mapping_for_property", "\n\n    def _object_mapping_for_property")
          if old not in text:
              raise SystemExit("query mapping helper block changed")
          p.write_text(text.replace(old, new))

          # Frontend relation editor: first-class list of identity pairs, no scalar compatibility branch.
          replace_between(
              "frontend/src/DraftEditor.tsx",
              "function LinkFields(",
              "function RuleFields(",
              '''function LinkFields({ document, objects, onChange }: { document: DraftDocument; objects: DraftDocument[]; onChange: (next: DraftDocument) => void }) {
            const identity = array(document.identity) as Record<string, unknown>[];
            const sourceProps = array(objects.find((item) => item.id === text(document.source))?.properties) as Record<string, unknown>[];
            const targetProps = array(objects.find((item) => item.id === text(document.target))?.properties) as Record<string, unknown>[];
            const sourceLabel = text(objects.find((item) => item.id === text(document.source))?.label) || text(document.source) || "源";
            const targetLabel = text(objects.find((item) => item.id === text(document.target))?.label) || text(document.target) || "目标";
            function updatePair(index: number, patch: Record<string, unknown>) {
              onChange({ ...document, identity: identity.map((item, position) => position === index ? { ...item, ...patch } : item) });
            }
            function addPair() {
              onChange({
                ...document,
                identity: [...identity, { source: text(sourceProps[0]?.id), target: text(targetProps[0]?.id) }],
              });
            }
            return <><div className="form-grid"><Field label="起点实体"><select aria-label="起点实体" value={text(document.source)} onChange={(event) => onChange({ ...document, source: event.target.value })}>{objects.map(option)}</select></Field><Field label="终点实体"><select aria-label="终点实体" value={text(document.target)} onChange={(event) => onChange({ ...document, target: event.target.value })}>{objects.map(option)}</select></Field><Field label="基数"><select aria-label="基数" value={text(document.cardinality) || "ONE"} onChange={(event) => onChange({ ...document, cardinality: event.target.value })}><option value="ONE">{cardinalityLabel("ONE")}</option><option value="MANY">{cardinalityLabel("MANY")}</option></select></Field></div><p className="mapping-hint">{cardinalityHint(sourceLabel, targetLabel, text(document.cardinality) || "ONE")}。目标实体为复合业务身份时，每个身份字段都必须有一条对应关系。</p><div className="field-array"><div className="field-array-head"><h3>业务键对应</h3><button className="secondary" onClick={addPair}>添加键对应</button></div>{identity.map((pair, index) => <div className="property-row" key={`${text(pair.source)}:${text(pair.target)}:${index}`}><Field label="起点业务键"><select aria-label={index === 0 ? "起点业务键" : `起点业务键 ${index + 1}`} value={text(pair.source)} onChange={(event) => updatePair(index, { source: event.target.value })}>{sourceProps.map((item) => <option key={text(item.id)}>{text(item.id)}</option>)}</select></Field><Field label="终点业务键"><select aria-label={index === 0 ? "终点业务键" : `终点业务键 ${index + 1}`} value={text(pair.target)} onChange={(event) => updatePair(index, { target: event.target.value })}>{targetProps.map((item) => <option key={text(item.id)}>{text(item.id)}</option>)}</select></Field>{identity.length > 1 ? <button className="icon-button" aria-label={`删除键对应 ${index + 1}`} onClick={() => onChange({ ...document, identity: identity.filter((_, position) => position !== index) })}>×</button> : null}</div>)}</div></>;
          }'''
          )

          p = Path("frontend/src/DraftEditor.tsx")
          text = p.read_text()
          old = 'if (kind === "Link") return { ...base, source: firstObject?.id ?? "", target: firstObject?.id ?? "", identity: { source: identityPropertyId(String(firstObject?.id.split(".").at(-1) ?? "id")), target: identityPropertyId(String(firstObject?.id.split(".").at(-1) ?? "id")) }, cardinality: "ONE", traversal: "FORWARD" };'
          new = 'if (kind === "Link") { const key = array(firstObject?.identityKeys).map(String)[0] ?? identityPropertyId(String(firstObject?.id.split(".").at(-1) ?? "id")); return { ...base, source: firstObject?.id ?? "", target: firstObject?.id ?? "", identity: [{ source: key, target: key }], cardinality: "ONE", traversal: "FORWARD" }; }'
          if old not in text:
              raise SystemExit("frontend makeDocument Link block changed")
          p.write_text(text.replace(old, new))

          # Side panel renders all identity pairs.
          p = Path("frontend/src/EntitySidePanels.tsx")
          text = p.read_text()
          text = text.replace(
              'const identity = object(link.identity);',
              'const identityPairs = array(link.identity) as Record<string, unknown>[];',
          )
          text = text.replace(
              'const sourceKey = text(identity.source) || "id";\n              const targetKey = text(identity.target) || "id";',
              'const sourceKey = identityPairs.map((pair) => text(pair.source)).filter(Boolean).join(" + ") || "id";\n              const targetKey = identityPairs.map((pair) => text(pair.target)).filter(Boolean).join(" + ") || "id";',
          )
          p.write_text(text)

          # Migrate YAML link declarations everywhere, including documentation snippets.
          yaml_pattern = re.compile(
              r'(?m)^(?P<i>\s*)identity:\n(?P=i)  source: (?P<s>[^\n]+)\n(?P=i)  target: (?P<t>[^\n]+)'
          )
          for p in list(Path(".").rglob("*.yaml")) + list(Path(".").rglob("*.yml")) + list(Path(".").rglob("*.md")):
              if ".git" in p.parts:
                  continue
              text = p.read_text(errors="ignore")
              text2 = yaml_pattern.sub(
                  lambda m: f'{m.group("i")}identity:\n{m.group("i")}  - source: {m.group("s")}\n{m.group("i")}    target: {m.group("t")}',
                  text,
              )
              if text2 != text:
                  p.write_text(text2)

          # Migrate Python/JSON-style literal link identities with quoted scalar field names.
          dict_pattern = re.compile(
              r'(["\']identity["\']\s*:\s*)\{\s*(["\']source["\']\s*:\s*["\'][^"\']+["\'])\s*,\s*(["\']target["\']\s*:\s*["\'][^"\']+["\'])\s*\}',
              re.S,
          )
          for p in Path("tests").rglob("*.py"):
              text = p.read_text()
              text2 = dict_pattern.sub(r'\1[{\2, \3}]', text)
              if text2 != text:
                  p.write_text(text2)

          # Add explicit end-to-end composite link coverage.
          Path("tests/test_composite_link_identity.py").write_text('''from __future__ import annotations

from semaloom.compiler.api import compile_documents
from semaloom.core.model import MappingDef
from semaloom.core.provider import IdentityScalar, IdentityValue, ObjectRead, ObjectSearch
from semaloom.core.results import Observation
from semaloom.runtime.auth import RequestActor
from semaloom.runtime.query import QueryService

ACTOR = RequestActor(tenant="tenant-a", subject="reader", roles=("analyst",))


class LinkProvider:
    def __init__(self) -> None:
        self.identities: list[IdentityValue] = []

    def fetch_metric(
        self,
        mapping: MappingDef,
        *,
        tenant: str,
        identity_value: IdentityValue,
        bindings: dict[str, IdentityScalar] | None = None,
    ) -> Observation:
        raise AssertionError("metric read not expected")

    def fetch_object(
        self,
        mapping: MappingDef,
        *,
        tenant: str,
        identity_value: IdentityValue,
    ) -> ObjectRead:
        self.identities.append(dict(identity_value))
        if mapping.target == "demo.Entry":
            values = {
                **identity_value,
                "targetLedger": "0L",
                "targetAccount": "A-7",
            }
        else:
            values = {**identity_value, "name": "Cash"}
        return ObjectRead(
            kind="PRESENT",
            values=values,
            mapping_id=mapping.id,
            source_id=mapping.source_id,
            observed_at="2026-09-17T00:00:00Z",
        )

    def search_objects(
        self,
        mapping: MappingDef,
        *,
        tenant: str,
        filters: dict[str, object],
        properties: tuple[str, ...],
        limit: int,
    ) -> ObjectSearch:
        raise AssertionError("search not expected")


def documents() -> list[dict[str, object]]:
    return [
        {
            "apiVersion": "semaloom/v0.1",
            "kind": "DomainPack",
            "id": "demo",
            "version": "1.0.0",
            "contractVersion": "v0.1",
            "namespace": "demo",
        },
        {
            "apiVersion": "semaloom/v0.1",
            "kind": "ObjectType",
            "id": "demo.Entry",
            "version": "1.0.0",
            "identityKeys": ["ledger", "entryId"],
            "properties": [
                {"id": "ledger", "valueType": "STRING", "required": True},
                {"id": "entryId", "valueType": "STRING", "required": True},
                {"id": "targetLedger", "valueType": "STRING"},
                {"id": "targetAccount", "valueType": "STRING"},
            ],
        },
        {
            "apiVersion": "semaloom/v0.1",
            "kind": "ObjectType",
            "id": "demo.Account",
            "version": "1.0.0",
            "identityKeys": ["ledger", "accountId"],
            "properties": [
                {"id": "ledger", "valueType": "STRING", "required": True},
                {"id": "accountId", "valueType": "STRING", "required": True},
                {"id": "name", "valueType": "STRING"},
            ],
        },
        {
            "apiVersion": "semaloom/v0.1",
            "kind": "Link",
            "id": "demo.entryAccount",
            "version": "1.0.0",
            "source": "demo.Entry",
            "target": "demo.Account",
            "identity": [
                {"source": "targetLedger", "target": "ledger"},
                {"source": "targetAccount", "target": "accountId"},
            ],
            "cardinality": "ONE",
            "traversal": "FORWARD",
        },
        {
            "apiVersion": "semaloom/v0.1",
            "kind": "Mapping",
            "id": "demo.Entry.pg",
            "version": "1.0.0",
            "target": "demo.Entry",
            "sourceId": "demo_pg",
            "provider": "postgres",
            "objectType": "demo.Entry",
            "expectedCardinality": "ONE",
            "physical": {
                "table": "entry",
                "grainColumns": {"ledger": "ledger", "entryId": "entry_id"},
                "propertyColumns": {
                    "targetLedger": "account_ledger",
                    "targetAccount": "account_id",
                },
            },
        },
        {
            "apiVersion": "semaloom/v0.1",
            "kind": "Mapping",
            "id": "demo.Account.pg",
            "version": "1.0.0",
            "target": "demo.Account",
            "sourceId": "demo_pg",
            "provider": "postgres",
            "objectType": "demo.Account",
            "expectedCardinality": "ONE",
            "physical": {
                "table": "account",
                "grainColumns": {"ledger": "ledger", "accountId": "account_id"},
                "propertyColumns": {"name": "name"},
            },
        },
        {
            "apiVersion": "semaloom/v0.1",
            "kind": "IntegrationBinding",
            "id": "demo.postgres",
            "version": "1.0.0",
            "provider": "postgres",
            "sourceId": "demo_pg",
            "mappings": ["demo.Entry.pg", "demo.Account.pg"],
        },
    ]


def bundle():
    result = compile_documents(documents())
    assert result.ok, result.diagnostics
    assert result.bundle is not None
    return result.bundle


def test_composite_link_preserves_full_target_identity() -> None:
    provider = LinkProvider()
    query = QueryService(bundle(), provider)
    envelope = query.follow_link(
        link_id="demo.entryAccount",
        source_identity={"ledger": "0L", "entryId": "E-1"},
        actor=ACTOR,
    )
    assert envelope.status == "SUCCEEDED"
    assert provider.identities == [
        {"ledger": "0L", "entryId": "E-1"},
        {"ledger": "0L", "accountId": "A-7"},
    ]
    assert envelope.observations[0].bindings == {"ledger": "0L", "accountId": "A-7"}
    assert envelope.extras["targetIdentity"] == {"ledger": "0L", "accountId": "A-7"}


def test_link_must_cover_every_target_identity_component() -> None:
    docs = documents()
    link = next(item for item in docs if item["kind"] == "Link")
    link["identity"] = [{"source": "targetAccount", "target": "accountId"}]
    result = compile_documents(docs)
    assert not result.ok
    assert any(item.code == "MISSING_LINK_IDENTITY" for item in result.diagnostics)


def test_old_scalar_link_identity_shape_is_rejected() -> None:
    docs = documents()
    link = next(item for item in docs if item["kind"] == "Link")
    link["identity"] = {"source": "targetAccount", "target": "accountId"}
    result = compile_documents(docs)
    assert not result.ok
    assert any(item.code == "INVALID_DEFINITION" for item in result.diagnostics)
