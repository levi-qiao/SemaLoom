name: Complete P0 composite links

on:
  push:
    branches:
      - feat/p0-capability-composite-identity
    paths:
      - .github/scripts/fix_p0_composite_links.py
      - .github/scripts/finish_p0_composite_links.py
      - .github/workflows/fix-p0-composite-links.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/p0-capability-composite-identity
          fetch-depth: 0
      - name: Apply first-stage migration
        shell: bash
        run: |
          set +e
          output="$(python .github/scripts/fix_p0_composite_links.py 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 1
          printf '%s\n' "$output" | grep -q "query mapping helper block changed"
      - name: Finish migration
        run: python .github/scripts/finish_p0_composite_links.py
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Backend checks
        run: |
          uv python install
          uv sync --frozen --all-groups
          uv run ruff format src/semaloom/core/model.py src/semaloom/compiler/api.py src/semaloom/runtime/query.py tests/test_composite_link_identity.py
          uv run ruff check src/semaloom/core/model.py src/semaloom/compiler/api.py src/semaloom/runtime/query.py tests/test_composite_link_identity.py
          uv run mypy
          uv run pytest tests/test_composite_link_identity.py tests/test_composite_identity_chain.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: frontend/.node-version
      - name: Frontend checks
        working-directory: frontend
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit clean implementation
        run: |
          rm .github/scripts/fix_p0_composite_links.py
          rm .github/scripts/finish_p0_composite_links.py
          rm .github/workflows/fix-p0-composite-links.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: make link traversal composite-identity complete"
          git push origin HEAD:feat/p0-capability-composite-identity
