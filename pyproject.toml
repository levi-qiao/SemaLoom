[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "semaloom"
version = "0.1.0"
description = "Enterprise business semantic layer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
authors = [{ name = "SemaLoom contributors" }]
keywords = ["semantic-layer", "enterprise", "knowledge-graph", "ai-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
semaloom = "semaloom.app.cli:main"

[project.urls]
Homepage = "https://github.com/levi-qiao/SemaLoom"
Changelog = "https://github.com/levi-qiao/SemaLoom/blob/main/CHANGELOG.md"
Documentation = "https://github.com/levi-qiao/SemaLoom/tree/main/docs"
Issues = "https://github.com/levi-qiao/SemaLoom/issues"
Repository = "https://github.com/levi-qiao/SemaLoom"

[dependency-groups]
dev = [
    "hatchling>=1.25",
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semaloom"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/semantic-spec",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/THIRD_PARTY_NOTICES.md",
    "/compose.yaml",
    "/ops",
    "/harness",
    "/frontend",
    "/uv.lock",
    "/.python-version",
    "/CONTEXT.md",
    "/pyproject.toml",
]
exclude = [
    "/.agents",
    "/docs/local-business-samples.md",
    "/ops/data",
    "/harness/node_modules",
    "/frontend/node_modules",
    "/frontend/dist",
    "/frontend/test-results",
    "**/node_modules/**",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/semaloom/runtime/analysis.py" = ["E501", "RUF001"]
"tests/test_chat_choices.py" = ["RUF001"]
"tests/test_semantic_closure.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["semaloom"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pyright]
include = ["src/semaloom"]
exclude = ["src/semaloom/app/static"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
typeCheckingMode = "standard"
reportIncompatibleVariableOverride = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel.force-include]
"harness/worker.mjs" = "semaloom/app/chat/harness/worker.mjs"
"harness/context-transform.mjs" = "semaloom/app/chat/harness/context-transform.mjs"
"harness/semantic-plugin.mjs" = "semaloom/app/chat/harness/semantic-plugin.mjs"
"harness/provider.mjs" = "semaloom/app/chat/harness/provider.mjs"
"harness/package.json" = "semaloom/app/chat/harness/package.json"
"harness/pnpm-lock.yaml" = "semaloom/app/chat/harness/pnpm-lock.yaml"
