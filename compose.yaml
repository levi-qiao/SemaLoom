# Local PostgreSQL fixture for later query/metadata tasks.
# T00 does not require this process to launch the identity entry.
# Start: docker compose up -d
# Stop:  docker compose down
# Data is ephemeral (tmpfs); do not store real business data here.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: semaloom
      POSTGRES_PASSWORD: semaloom
      POSTGRES_DB: semaloom_dev
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaloom -d semaloom_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
